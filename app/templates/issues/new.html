{% extends 'base.html' %}
{% block title %}Yeni Bakım Talebi | YurtTakip{% endblock %}
{% block content %}<header class="page-heading"><div><span class="eyebrow">Bakım talebi</span><h1>Sorun nedir?</h1><p class="muted">Talep mevcut odanız için otomatik oluşturulur.</p></div><a class="text-link" href="{{ url_for('main.dashboard') }}">Geri dön ←</a></header><section class="panel form-panel"><form method="post" enctype="multipart/form-data" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="title">Kısa başlık</label><input class="form-control" id="title" name="title" required minlength="4" maxlength="120" placeholder="Örnek: Lavabonun altından su sızıyor"><label class="form-label" for="description">Sorunu açıklayın</label><textarea class="form-control" id="description" name="description" rows="5" required minlength="10" maxlength="3000" placeholder="Ne zaman başladı? Nerede görülüyor?"></textarea><label class="form-label" for="photo">Fotoğraf (isteğe bağlı)</label><input class="form-control" id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp"><div class="form-hint">JPG, PNG veya WEBP · En fazla 5 MB</div><div class="form-actions"><a class="btn btn-light-outline-dark" href="{{ url_for('main.dashboard') }}">İptal</a><button class="btn btn-primary">Talebi gönder <span aria-hidden="true">←</span></button></div></form></section>{% endblock %}
