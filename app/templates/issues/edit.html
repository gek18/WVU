{% extends 'base.html' %}
{% block title %}Talep #{{ issue.id }} Düzenle | YurtTakip{% endblock %}
{% block content %}<header class="page-heading"><div><span class="eyebrow">Talep #{{ issue.id }} düzenle</span><h1>Arıza bilgilerini güncelleyin</h1><p class="muted">Talep, teknisyene atanmadan önce düzenlenebilir.</p></div><a class="text-link" href="{{ url_for('issues.issue_detail', issue_id=issue.id) }}">Geri dön ←</a></header><section class="panel form-panel"><form method="post" class="form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="title">Başlık</label><input class="form-control" id="title" name="title" value="{{ issue.title }}" required minlength="4" maxlength="120"><label class="form-label" for="description">Açıklama</label><textarea class="form-control" id="description" name="description" rows="5" required minlength="10" maxlength="3000">{{ issue.description }}</textarea><div class="form-actions"><a class="btn btn-light-outline-dark" href="{{ url_for('issues.issue_detail', issue_id=issue.id) }}">İptal</a><button class="btn btn-primary">Değişiklikleri kaydet</button></div></form></section>{% endblock %}
