{% extends 'base.html' %}
{% block title %}Arızalar | YurtTakip{% endblock %}
{% block content %}<header class="page-heading"><div><span class="eyebrow">Bakım kayıtları</span><h1>Arızalar</h1><p class="muted">Her talebin durumunu ve güncellemelerini takip edin.</p></div>{% if current_user.role == 'student' %}<a class="btn btn-primary" href="{{ url_for('issues.create_issue') }}">+ Bakım talebi</a>{% endif %}</header><section class="panel"><form method="get" class="filter-row"><label for="status" class="form-label mb-0">Durum</label><select id="status" name="status" class="form-select filter-select"><option value="">Tüm durumlar</option>{% for value,label in [('open','Açık'),('assigned','Atandı'),('in_progress','Onarımda'),('closed','Kapalı')] %}<option value="{{ value }}" {% if status==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn btn-outline-secondary">Filtrele</button></form>{% include 'issues/_table.html' %}</section>{% endblock %}
